# Catraca local stack. Every host port is configurable (see .env.example / docs/operations/configuracao.md).
# Profiles:
#   (none)         postgres, migrate (migrations + seed), app, worker
#   observability  otel-collector, prometheus, grafana, jaeger, loki (enabled by `make up` when OBSERVABILITY=1)
#   tools          lint/typecheck/test runner (used by `make gates` / `make test-*`)

x-app-image: &app-image
  image: catraca-app:${COMPOSE_PROJECT_NAME:-catraca}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: runtime

x-app-env: &app-env
  DATABASE_URL: postgres://catraca:catraca@postgres:5432/catraca
  SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me-0123456789}
  PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-partner-key-dev}
  GATEWAY_MODE: ${GATEWAY_MODE:-simulated}
  GATEWAY_DELAY_SCALE: ${GATEWAY_DELAY_SCALE:-1}
  WORKER_POLL_MS: ${WORKER_POLL_MS:-200}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  # Metrics are scraped by Prometheus (prom-client), not pushed through OpenTelemetry.
  OTEL_METRICS_EXPORTER: none

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catraca -d catraca']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app-image
    command: ['node', 'src/db/setup.ts']
    environment:
      <<: *app-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    <<: *app-image
    command: ['node', '--import', './src/observability/otel.ts', 'src/main.ts']
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: catraca-app
      PORT: 8080
    ports:
      - '${APP_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *app-image
    command: ['node', '--import', './src/observability/otel.ts', 'src/worker/main.ts']
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: catraca-worker
      METRICS_PORT: 9464
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9464/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------- observability (F09)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    profiles: ['observability']
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # The image has no shell/wget for a healthcheck: "up" waits for it to be running, and the
    # SDK retries/buffers while it starts.
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: ['observability']
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:13133/status']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.10
    profiles: ['observability']
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./docker/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - '${LOKI_PORT:-3100}:3100'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ['observability']
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2
    profiles: ['observability']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

  tools:
    image: catraca-tools:${COMPOSE_PROJECT_NAME:-catraca}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: dev
    profiles: ['tools']
    environment:
      DATABASE_URL: postgres://catraca:catraca@postgres:5432/catraca
      TEST_BASE_URL: http://app:8080
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-partner-key-dev}
      GATEWAY_DELAY_SCALE: ${GATEWAY_DELAY_SCALE:-1}
      CI: 'true'

volumes:
  pgdata:
